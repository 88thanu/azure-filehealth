name: Deploy Flask App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop existing Flask app
        run: |
          pkill -f app.py || true

      - name: Deploy latest code to VM folder
        run: |
          rsync -av --delete ./ ~/filehealth/

      - name: Setup Python environment
        run: |
          cd ~/filehealth
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install flask

      - name: Start Flask app
        run: |
          cd ~/filehealth
          python3 -m venv venv || true
          ~/filehealth/venv/bin/pip install flask || true
          
          screen -dmS flaskapp bash -c "~/filehealth/venv/bin/python ~/filehealth/app.py > ~/filehealth/screen.log 2>&1"