name: Deploy Flask App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop existing Flask app
        run: |
          pkill -f app.py || true

      - name: Deploy latest code to VM folder
        run: |
          rsync -av --delete ./ ~/filehealth/

      - name: Setup Python environment
        run: |
          cd ~/filehealth
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install flask

      - name: Start Flask app
        run: |
          cd ~/filehealth
          python3 -m venv venv || true
          source venv/bin/activate
          pip install -r requirements.txt || pip install flask
          nohup python app.py > app.log 2>&1 &
          sleep 3
          ps aux | grep app.py